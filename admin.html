<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f28bad"><title>奶鍋後台｜粉絲基地管理</title>
  <style>
    :root{--pink:#f28bad;--ink:#574752;--muted:#9a8791;--line:#f3e7e9;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;background:#fff8f7;color:var(--ink);font-family:system-ui,'Noto Sans TC',sans-serif}.wrap{max-width:920px;margin:36px auto;padding:0 18px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.head a{color:#d87597;text-decoration:none}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 6px 20px #f3e7e955}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 16px}.hint{color:var(--muted);font-size:13px;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:12px;color:#907b84}input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px;background:#fffdfc}textarea{min-height:92px;resize:vertical}.wide{grid-column:1/-1}.btn{border:0;border-radius:22px;background:var(--pink);color:white;padding:10px 16px;font-weight:700;cursor:pointer}.btn.alt{background:#fff0f4;color:#d87597}.btn.danger{background:#fff1ee;color:#b65f54}.days{display:flex;gap:7px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:3px;color:#8e7580}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.event{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;background:#fff9f8;border-radius:13px;margin:9px 0}.event small{display:block;color:var(--muted);margin-top:4px}.hidden{display:none!important}.status{font-size:13px;margin-top:10px;color:#8b7180}.status.error{color:#b65055}.status.ok{color:#56866b}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.inline{display:flex;gap:8px;align-items:center}@media(max-width:620px){.wrap{margin:20px auto}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{align-items:flex-start}}
  </style>
</head>
<body><main class="wrap">
  <header class="head"><div><h1>奶鍋管理後台 ✦</h1><div class="hint">編輯公開直播行程與奶鍋簡介</div></div><a href="./">← 回粉絲網站</a></header>
  <section id="setup" class="card hidden"><h2>尚未連接資料庫</h2><p class="hint">後台頁面已準備好。請先建立 Supabase 專案，將 Project URL 與 anon key 填入 <code>admin-config.js</code>，並執行附上的 <code>supabase-schema.sql</code>。設定完成後重新整理即可登入。</p><a class="btn alt" href="https://supabase.com/dashboard" target="_blank" rel="noreferrer">開啟 Supabase</a></section>
  <section id="login" class="card hidden"><h2>管理者登入</h2><div class="grid"><label>電子郵件<input id="email" type="email" autocomplete="username"></label><label>密碼<input id="password" type="password" autocomplete="current-password"></label></div><p class="row"><button class="btn" id="loginBtn">登入後台</button></p><div id="loginStatus" class="status"></div><p class="hint">第一次使用：在 Supabase Authentication 建立你的管理者帳號，並依設定說明將帳號加入管理員清單。</p></section>
  <section id="dashboard" class="hidden">
    <div class="card topline"><div><strong>後台已登入</strong><div class="hint" id="who"></div></div><button class="btn alt" id="logoutBtn">登出</button></div>
    <section class="card"><h2>直播行程管理</h2><div class="grid"><label>日期<input id="eventDate" type="date"></label><label>開播時間<input id="eventTime" type="time" value="21:00"></label><label>行程名稱<input id="eventTitle" placeholder="例如：萬聖節回"></label><label>公開狀態<select id="eventPublished"><option value="true">公開</option><option value="false">草稿</option></select></label><label class="wide">補充說明<input id="eventDescription" placeholder="例如：和奶鍋一起過萬聖節！"></label></div><p><button class="btn" id="saveEvent">新增行程</button></p><div id="events"></div></section>
    <section class="card"><h2>奶鍋簡介設定</h2><div class="grid"><label>名稱<input id="profileName"></label><label>標語<input id="tagline"></label><label class="wide">簡介<textarea id="bio"></textarea></label><label>直播平台／頻道名稱<input id="streamLabel" placeholder="例如：YouTube"></label><label>直播或社群連結<input id="socialUrl" type="url" placeholder="https://..."></label><label>固定開播時間<input id="streamTime" type="time" value="21:00"></label><label>固定開播日<div class="days"><label><input type="checkbox" data-weekday value="1" checked>週一</label><label><input type="checkbox" data-weekday value="2" checked>週二</label><label><input type="checkbox" data-weekday value="3" checked>週三</label><label><input type="checkbox" data-weekday value="4" checked>週四</label><label><input type="checkbox" data-weekday value="5" checked>週五</label><label><input type="checkbox" data-weekday value="6">週六</label><label><input type="checkbox" data-weekday value="0">週日</label></div></label></div><p><button class="btn" id="saveSettings">儲存簡介設定</button></p></section>
    <div id="dashboardStatus" class="status"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./admin-config.js"></script>
<script>
const cfg=window.NAIGUO_SUPABASE||{};const setup=document.getElementById('setup'),login=document.getElementById('login'),dashboard=document.getElementById('dashboard');let db;
function status(id,msg,type=''){const el=document.getElementById(id);el.textContent=msg;el.className='status '+type}
function ready(show){setup.classList.toggle('hidden',show);login.classList.toggle('hidden',!show);dashboard.classList.add('hidden')}
if(!cfg.url||!cfg.anonKey||!window.supabase){setup.classList.remove('hidden')}else{db=window.supabase.createClient(cfg.url,cfg.anonKey);ready(true);db.auth.getSession().then(({data})=>{if(data.session)showDashboard(data.session.user)});document.getElementById('loginBtn').onclick=async()=>{status('loginStatus','登入中…');const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)status('loginStatus',error.message,'error');else showDashboard(data.user)};document.getElementById('logoutBtn').onclick=async()=>{await db.auth.signOut();ready(true)};document.getElementById('saveEvent').onclick=saveEvent;document.getElementById('saveSettings').onclick=saveSettings}
async function showDashboard(user){login.classList.add('hidden');dashboard.classList.remove('hidden');document.getElementById('who').textContent=user.email||'';await Promise.all([loadEvents(),loadSettings()])}
async function loadEvents(){const {data,error}=await db.from('stream_events').select('*').order('event_date',{ascending:true});if(error){status('dashboardStatus','讀取行程失敗：'+error.message,'error');return}const root=document.getElementById('events');root.innerHTML=data.length?data.map(e=>`<article class="event"><div><strong>${esc(e.event_date)}　${esc((e.event_time||'').slice(0,5))}　${esc(e.title)}</strong><small>${esc(e.description||'')}${e.is_published?' ・公開':' ・草稿'}</small></div><button class="btn danger" data-delete="${e.id}">刪除</button></article>`).join(''):'<p class="hint">尚無行程，新增第一筆吧。</p>';root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteEvent(b.dataset.delete))}
async function saveEvent(){const event_date=document.getElementById('eventDate').value,title=document.getElementById('eventTitle').value.trim();if(!event_date||!title){status('dashboardStatus','請填寫日期和行程名稱。','error');return}const row={event_date,event_time:document.getElementById('eventTime').value||'21:00',title,description:document.getElementById('eventDescription').value.trim(),is_published:document.getElementById('eventPublished').value==='true'};const {error}=await db.from('stream_events').insert(row);if(error){status('dashboardStatus','新增失敗：'+error.message,'error');return}document.getElementById('eventTitle').value='';document.getElementById('eventDescription').value='';status('dashboardStatus','直播行程已儲存。','ok');await loadEvents()}
async function deleteEvent(id){if(!confirm('確定刪除這筆行程？'))return;const {error}=await db.from('stream_events').delete().eq('id',id);if(error){status('dashboardStatus','刪除失敗：'+error.message,'error');return}status('dashboardStatus','行程已刪除。','ok');await loadEvents()}
async function loadSettings(){const {data,error}=await db.from('site_settings').select('*').eq('id','main').maybeSingle();if(error){status('dashboardStatus','讀取簡介失敗：'+error.message,'error');return}if(data){for(const [id,key] of [['profileName','profile_name'],['tagline','tagline'],['bio','bio'],['streamLabel','stream_label'],['socialUrl','social_url'],['streamTime','stream_time']])document.getElementById(id).value=data[key]||'';document.getElementById('streamTime').value=(data.stream_time||'21:00').slice(0,5);document.querySelectorAll('[data-weekday]').forEach(x=>x.checked=(data.stream_days||[1,2,3,4,5]).includes(Number(x.value)))}}
async function saveSettings(){const row={id:'main',profile_name:document.getElementById('profileName').value.trim(),tagline:document.getElementById('tagline').value.trim(),bio:document.getElementById('bio').value.trim(),stream_label:document.getElementById('streamLabel').value.trim(),social_url:document.getElementById('socialUrl').value.trim(),stream_time:document.getElementById('streamTime').value||'21:00',stream_days:[...document.querySelectorAll('[data-weekday]:checked')].map(x=>Number(x.value)),updated_at:new Date().toISOString()};const {error}=await db.from('site_settings').upsert(row);status('dashboardStatus',error?'儲存失敗：'+error.message:'簡介設定已儲存。',error?'error':'ok')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
